<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Shortener</title>
  <meta name="description" content="A premium, fast, and minimalist URL shortener.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <main class="container">
    <header>
      <h1>sl<span class="dot">.</span></h1>
      <p class="subtitle">Shorten your links with style</p>
    </header>

    <div id="error-container" class="error-msg">
      <span id="error-text"></span>
    </div>

    <form id="shorten-form">
      <div class="input-group">
        <label for="url" style="display:none;">Original URL</label>
        <input type="url" id="url" required placeholder="Enter a long URL...">
      </div>
      <button type="submit" id="submit-btn" class="btn-primary">
        <span id="submit-text">Shorten URL</span>
        <div id="loading-spinner" class="spinner"></div>
      </button>
    </form>

    <div id="result-container" class="result-section">
      <p class="result-label">Generated Link</p>
      <a id="short-url-link" href="#" target="_blank" class="result-link"></a>
      <button id="copy-btn" class="btn-secondary">
        <span id="copy-text">Copy to Clipboard</span>
      </button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
